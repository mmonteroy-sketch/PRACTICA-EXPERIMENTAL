
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Calificaciones</title>
</head>
<body>

    <h1>Sistema de búsqueda y análisis de calificaciones</h1>

    <p>Ingrese las calificaciones de los 15 estudiantes.</p>

    <form id="formulario">

        <h3>Calificaciones de los estudiantes</h3>

        <table border="1" cellpadding="8">
            <tr>
                <th>Estudiante</th>
                <th>Calificación</th>
                <th>Estudiante</th>
                <th>Calificación</th>
                <th>Estudiante</th>
                <th>Calificación</th>
            </tr>

            <tr>
                <td>1</td>
                <td><input type="number" id="nota0" min="0" max="10" step="any" required></td>
                <td>2</td>
                <td><input type="number" id="nota1" min="0" max="10" step="any" required></td>
                <td>3</td>
                <td><input type="number" id="nota2" min="0" max="10" step="any" required></td>
            </tr>

            <tr>
                <td>4</td>
                <td><input type="number" id="nota3" min="0" max="10" step="any" required></td>
                <td>5</td>
                <td><input type="number" id="nota4" min="0" max="10" step="any" required></td>
                <td>6</td>
                <td><input type="number" id="nota5" min="0" max="10" step="any" required></td>
            </tr>

            <tr>
                <td>7</td>
                <td><input type="number" id="nota6" min="0" max="10" step="any" required></td>
                <td>8</td>
                <td><input type="number" id="nota7" min="0" max="10" step="any" required></td>
                <td>9</td>
                <td><input type="number" id="nota8" min="0" max="10" step="any" required></td>
            </tr>

            <tr>
                <td>10</td>
                <td><input type="number" id="nota9" min="0" max="10" step="any" required></td>
                <td>11</td>
                <td><input type="number" id="nota10" min="0" max="10" step="any" required></td>
                <td>12</td>
                <td><input type="number" id="nota11" min="0" max="10" step="any" required></td>
            </tr>

            <tr>
                <td>13</td>
                <td><input type="number" id="nota12" min="0" max="10" step="any" required></td>
                <td>14</td>
                <td><input type="number" id="nota13" min="0" max="10" step="any" required></td>
                <td>15</td>
                <td><input type="number" id="nota14" min="0" max="10" step="any" required></td>
            </tr>
        </table>

        <br>

        <h3>Calificación de referencia</h3>

        <label>Ingrese la calificación que desea buscar:</label>
        <input type="number" id="busqueda" min="0" max="10" step="any" required>

        <br><br>

        <button type="submit">Buscar y analizar</button>

    </form>

    <hr>

    <h2>Resultados</h2>

    <div id="resultado"></div>

    <script src="script.js"></script>

</body>
</html>
